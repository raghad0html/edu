name: Build Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # حل مشكلة المجلد المفقود في pubspec.yaml
      - name: Ensure missing asset directory exists
        run: mkdir -p assets/images/search

      - name: Get dependencies
        run: flutter pub get

      # حل مشكلتي الـ Namespace والـ JVM Target لمكتبة ar_flutter_plugin
      - name: Fix ar_flutter_plugin compatibility issues
        run: |
          AR_PLUGIN_PATH=$(find /home/runner/.pub-cache -name "ar_flutter_plugin-*" -type d | head -n 1)
          if [ -d "$AR_PLUGIN_PATH" ]; then
            echo "Fixing namespace and JVM target for $AR_PLUGIN_PATH"
            # إضافة namespace
            sed -i '/android {/a \    namespace "com.alex.ar_flutter_plugin"' "$AR_PLUGIN_PATH/android/build.gradle"
            # ضبط jvmTarget إلى 1.8 لتطابق Java
            sed -i 's/jvmTarget = "17"/jvmTarget = "1.8"/g' "$AR_PLUGIN_PATH/android/build.gradle"
            sed -i 's/jvmTarget = "11"/jvmTarget = "1.8"/g' "$AR_PLUGIN_PATH/android/build.gradle"
            sed -i '/android {/a \    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }' "$AR_PLUGIN_PATH/android/build.gradle"
          fi

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
