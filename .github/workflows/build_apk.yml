name: Build Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. إنشاء المجلد المفقود
      - name: Ensure missing asset directory exists
        run: mkdir -p assets/images/search

      - name: Get dependencies
        run: flutter pub get

      # 2. تعديل جذري لملف build.gradle الخاص بمكتبة ar_flutter_plugin
      - name: Directly Patch ar_flutter_plugin build.gradle
        run: |
          AR_BUILD_GRADLE=$(find /home/runner/.pub-cache -name "build.gradle" | grep "ar_flutter_plugin" | head -n 1)
          if [ -f "$AR_BUILD_GRADLE" ]; then
            echo "Found plugin at $AR_BUILD_GRADLE, patching now..."
            
            # إضافة namespace
            sed -i '/android {/a \    namespace "com.alex.ar_flutter_plugin"' "$AR_BUILD_GRADLE"
            
            # استبدال أي إشارة لـ 1.8 أو 11 بـ 17 بشكل مباشر وجذري
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$AR_BUILD_GRADLE"
            sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' "$AR_BUILD_GRADLE"
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$AR_BUILD_GRADLE"
            sed -i 's/jvmTarget = "11"/jvmTarget = "17"/g' "$AR_BUILD_GRADLE"
            sed -i 's/jvmTarget = '\''1.8'\''/jvmTarget = '\''17'\''/g' "$AR_BUILD_GRADLE"
            sed -i 's/jvmTarget = '\''11'\''/jvmTarget = '\''17'\''/g' "$AR_BUILD_GRADLE"
            
            echo "--- Modified build.gradle content ---"
            cat "$AR_BUILD_GRADLE"
          fi

      # 3. بناء الـ APK
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
