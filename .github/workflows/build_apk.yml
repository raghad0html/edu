name: Build Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # استخدام Java 11 لضمان التوافق التام مع مكتبة AR
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # إنشاء المجلد المفقود لضمان عدم توقف البناء
      - name: Ensure missing asset directory exists
        run: mkdir -p assets/images/search

      - name: Get dependencies
        run: flutter pub get

      # إصلاح الـ Namespace وتوافقية Java/Kotlin لمكتبة ar_flutter_plugin
      - name: Fix ar_flutter_plugin compatibility issues
        run: |
          AR_PLUGIN_PATH=$(find /home/runner/.pub-cache -name "ar_flutter_plugin-*" -type d | head -n 1)
          if [ -d "$AR_PLUGIN_PATH" ]; then
            echo "Fixing namespace and JVM options for $AR_PLUGIN_PATH"
            # إضافة الـ namespace المطلوب
            sed -i '/android {/a \    namespace "com.alex.ar_flutter_plugin"' "$AR_PLUGIN_PATH/android/build.gradle"
            
            # توحيد jvmTarget لكود Kotlin ليكون 11
            sed -i 's/jvmTarget = .*/jvmTarget = "11"/g' "$AR_PLUGIN_PATH/android/build.gradle"
            
            # توحيد compileOptions للـ Java لتصبح 11
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_11/g' "$AR_PLUGIN_PATH/android/build.gradle"
            sed -i 's/JavaVersion.VERSION_17/JavaVersion.VERSION_11/g' "$AR_PLUGIN_PATH/android/build.gradle"
            sed -i 's/1.8/11/g' "$AR_PLUGIN_PATH/android/build.gradle"
          fi

      # ضبط jvmTarget بـ gradle.properties الخاص بالمشروع
      - name: Configure Gradle Properties
        run: |
          echo "android.kotlin.jvm.target=11" >> android/gradle.properties

      # البناء الأساسي للتطبيق
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
