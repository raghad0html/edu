name: Build Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. تثبيت Java 17
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 2. إنشاء المجلد المفقود لضمان عدم توقف البناء
      - name: Ensure missing asset directory exists
        run: mkdir -p assets/images/search

      - name: Get dependencies
        run: flutter pub get

      # 3. إضافة الـ namespace لمكتبة ar_flutter_plugin
      - name: Fix ar_flutter_plugin namespace
        run: |
          AR_PLUGIN_PATH=$(find /home/runner/.pub-cache -name "ar_flutter_plugin-*" -type d | head -n 1)
          if [ -d "$AR_PLUGIN_PATH" ]; then
            echo "Fixing namespace for $AR_PLUGIN_PATH"
            sed -i '/android {/a \    namespace "com.alex.ar_flutter_plugin"' "$AR_PLUGIN_PATH/android/build.gradle"
          fi

      # 4. توحيد توافقية Java و Kotlin باستخدام compilerOptions القياسية الحديثة
      - name: Force Java 17 Compatibility using CompilerOptions
        run: |
          cat << 'EOF' >> android/app/build.gradle.kts

          subprojects {
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  }
              }
              tasks.withType<JavaCompile>().configureEach {
                  sourceCompatibility = JavaVersion.VERSION_17.toString()
                  targetCompatibility = JavaVersion.VERSION_17.toString()
              }
          }
          EOF

      # 5. البناء الأساسي للتطبيق
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
